name: Deploy v6 rename
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move v6 files into place
        run: |
          git config user.name "aiagents-bbs"
          git config user.email "aiagents-bbs@users.noreply.github.com"
          git mv -f v6temp/landing-page-demo.html index.html
          git mv -f v6temp/ecom-tracker.js ecom-tracker.js
          git status --short
          git commit -m "Deploy v6 landing page and tracker"
          git push
